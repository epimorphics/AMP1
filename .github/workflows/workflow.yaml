name: AWS Hosted Workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  StartHostedRunner:
    runs-on: ubuntu-26.04
    outputs:
      spot-req-id: ${{ steps.StartHostedRunner.outputs.spot-req-id }}
    steps:
      - name: "Start Hosted Runner"
        id: StartHostedRunner
        uses: epimorphics/github-actions/start-hosted-runner@main
        with:
          aws-access-key-id:     "${{ secrets.BUILD_EPI_EXPT_AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.BUILD_EPI_EXPT_AWS_SECRET_ACCESS_KEY }}"
  HostedAction:
    runs-on: self-hosted
    needs: StartHostedRunner
    steps:
      - name: "Self Hosted Action"
        id: HostedAction
        shell: bash
        run: |
          echo "Spot Fleet Request: ${{ needs.StartHostedRunner.outputs.spot-req-id }}"
  StopHostedRunner:
    runs-on: ubuntu-26.04
    needs: [HostedAction, StartHostedRunner]
    steps:
      - name: "Cancel Spot Fleet Request"
        uses: epimorphics/github-actions/stop-hosted-runner@main
        with:
          aws-access-key-id:     "${{ secrets.BUILD_EPI_EXPT_AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.BUILD_EPI_EXPT_AWS_SECRET_ACCESS_KEY }}"
          spot_req_id:           "${{ needs.StartHostedRunner.outputs.spot-req-id }}"
