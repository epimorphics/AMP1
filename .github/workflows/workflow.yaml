name: AWS Hosted Workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: "Deploy via AWS Hosted Runner"
    uses:  "epimorphics/github-workflows/.github/workflows/hosted-deploy.yml@main"
    with:
      # Repository specific
      ansible_playbook: pres.yml
      ansible_repo:     epimorphics/hmlr-ansible-deployment
      ansible_repo_ref: master
      # Fixed
      aws_asg:    "hmlr-infra-runner"
      aws_runner: "hmlr-github-runner"
      deploy: dev
      key:    landing
      tag:    2.3.6_f88bba3_00000365
    secrets:
      # Repository specific
      ansible_vault_password: "${{ secrets.HMLR_ANSIBLE_VAULT_PASSWORD }}"
      aws_access_key_id:      "${{ secrets.BUILD_HMLR_AWS_ACCESS_KEY_ID }}"
      aws_secret_access_key:  "${{ secrets.BUILD_HMLR_AWS_SECRET_ACCESS_KEY }}"
      ssh_key:                "${{ secrets.HMLR_SSH_KEY }}"
      # Fixed
      github_pat: "${{ secrets.GIT_REPOSITORY_FULL_ACCESS_PAT }}"


