name: AWS Hosted Workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  StartHostedRunner:
    name: "Start Hosted Runner"
    runs-on: ubuntu-26.04
    outputs:
      spot-req-id: ${{ steps.StartHostedRunner.outputs.spot-req-id }}
    steps:
      - name: "Start AWS Hosted Runner"
        id: StartHostedRunner

        uses: epimorphics/github-actions/start-hosted-runner@aeecee6
        with:
          aws-access-key-id:     "${{ secrets.BUILD_HMLR_AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.BUILD_HMLR_AWS_SECRET_ACCESS_KEY }}"
#         aws-asg:               "hmlr-infra-runner"
          runner:                "hmlr-github-runner"
          spot-file:             "s3://epimorphics-github-actions/spot-fleet-request.json"

  HostedAction:
    name: "Hosted Action"
    runs-on: self-hosted
    needs: StartHostedRunner
    steps:
      - name: "Self Hosted Action"
        id: HostedAction
        shell: bash
        run: |
          echo "This is a self-hosted action running on an AWS EC2 instance started by the StartHostedRunner job."
          echo "Spot Fleet Request: ${{ needs.StartHostedRunner.outputs.spot-req-id }}"

      - name: "AWS Credentials"
        id: AWSCredentials
        uses: epimorphics/github-actions/aws-credentials@main
        with:
          aws-access-key-id:     "${{ secrets.BUILD_HMLR_AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.BUILD_HMLR_AWS_SECRET_ACCESS_KEY }}"
          aws-profile:           "default"

      - name: "Bastion"
        id: Bastion
        uses: epimorphics/github-actions/bastion@main
        with:
          bastion: "hmlr-bastion"

      - name: "Deployment Repository Checkout"
        id: Checkout
        uses: actions/checkout@v6
        with:
          repository: "epimorphics/hmlr-ansible-deployment"
          ref:        "master"
          token:      "${{ secrets.GIT_REPOSITORY_FULL_ACCESS_PAT }}"

      - name: "Ansible Deployment"
        id: AnsibleDeployment
        uses: epimorphics/github-actions/ansible-deploy-image@main
        with:
          playbook: "update.yml"
          stage:    "dev"
          secret:   "${{ secrets.HMLR_ANSIBLE_VAULT_PASSWORD }}"

