name: AWS Hosted Workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  Checkout:
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_PAT }}

  StartHostedRunner:
    runs-on: ubuntu-26.04
    outputs:
      spot-req-id: ${{ steps.StartHostedRunner.outputs.spot-req-id }}
    steps:
      - name: "Start Hosted Runner"
        id: StartHostedRunner
        uses: epimorphics/github-actions/start-hosted-runner@main
        with:
          aws-access-key-id:     "${{ secrets.BUILD_HMLR_AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.BUILD_HMLR_AWS_SECRET_ACCESS_KEY }}"
          spot-file:             "s3://epimorphics-github-actions/spot-fleet-request.json"

  HostedAction:
    runs-on: self-hosted
    needs: StartHostedRunner
    steps:
      - name: "Self Hosted Action"
        id: HostedAction
        shell: bash
        run: |
          echo "Spot Fleet Request: ${{ needs.StartHostedRunner.outputs.spot-req-id }}"
          echo "This is a self-hosted action running on an AWS EC2 instance started by the StartHostedRunner job."
      - name: "Ansible Deployment Repository Checkout"
        id: Checkout
        uses: actions/checkout@v6
        with:
          repository: epimorphics/hmlr-ansible-deployment
          ref:        master
#         token:      "${{ secrets.GITHUB_PAT }}"
          token:      ${{ secrets.GIT_REPOSITORY_FULL_ACCESS_PAT }}

  StopHostedRunner:
    runs-on: ubuntu-26.04
    needs: [HostedAction, StartHostedRunner]
    if: (always() && needs.StartHostedRunner.outputs.spot-req-id != '')
    steps:
      - name: "Cancel Spot Fleet Request"
        uses: epimorphics/github-actions/stop-hosted-runner@main
        with:
          aws-access-key-id:     "${{ secrets.BUILD_HMLR_AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.BUILD_HMLR_AWS_SECRET_ACCESS_KEY }}"
          spot-req-id:           "${{ needs.StartHostedRunner.outputs.spot-req-id }}"
